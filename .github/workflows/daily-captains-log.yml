# settling deploy: forces a single clean re-deploy of current main state
# daily-captains-log.yml
#
# Belt-and-suspenders alternative to the Cowork scheduled task. Runs
# entirely on GitHub's infrastructure — does not touch Cowork usage,
# does not require your computer to be on, does not depend on any
# Claude product being available.
#
# DEPLOY METHOD: Wrangler direct deploy, not Git integration. The
# existing Cloudflare Pages project (super-mode-9b19, serving
# cogheim.com) was created as a Direct Upload project, and Cloudflare
# does not allow converting a Direct Upload project to Git integration
# after the fact (confirmed against Cloudflare's own docs, 30 Aug 2026).
# The only way to get true git-triggered deploys would be a brand new
# Pages project with the domain migrated over — not worth it for this.
# So this workflow pushes to GitHub for version history/audit trail,
# then deploys straight to the existing project via Wrangler + an API
# token, same as any other Direct Upload deploy, just automated.
#
# REQUIRED REPO SECRETS (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY           — a real Anthropic API key with billing enabled.
#                                 This is a metered API call, NOT covered by a
#                                 Claude.ai/Cowork subscription. Budget for it.
#   CLOUDFLARE_API_TOKEN        — scoped to Account → Cloudflare Pages → Edit.
#                                 (Account ID is hardcoded below — it's not a
#                                 sensitive value on its own, no need to secret it.)
#   DISCORD_DEVLOG_WEBHOOK      — Discord webhook URL for the #devlog-updates
#                                 channel. Optional — if unset, the notify step
#                                 just logs and skips, doesn't fail the workflow.
#   DISCORD_CAPTAINSLOG_WEBHOOK — Discord webhook URL for the #captains-log
#                                 channel. Same optional behavior.
#
# TIMEZONE NOTE: cron below is UTC. 06:30 Mountain Time is:
#   12:30 UTC during MDT (roughly mid-March to early November)
#   13:30 UTC during MST (roughly early November to mid-March)
# This file ships set to MDT. Flip the cron line when DST changes, or
# maintain both jobs with an `if` guard on month — simplicity was chosen
# over perfect automation here; a missed hour twice a year is a
# low-stakes failure mode for an atmosphere post.

name: Daily Captain's Log

on:
  schedule:
    - cron: "30 12 * * *"   # 06:30 America/Denver during MDT
  workflow_dispatch: {}       # lets you trigger a manual test run from the Actions tab
  push:
    branches: [main]          # any commit to main deploys the current site state —
                               # not just the daily generated entry. The generate
                               # step still only publishes when a queue line matches
                               # today's date; it's a no-op otherwise, so ordinary
                               # site edits pushed here just deploy as-is.

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need the prior commit too, so the devlog-diff step below can compare against it

      - name: Detect new Devlog posts in this push
        id: devlog_check
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          NEW_FILES=$(git diff --name-status ${{ github.event.before }} ${{ github.sha }} -- 'site/devlog-*.html' 2>/dev/null | awk '$1=="A" {print $2}' || true)
          echo "new_devlog_files<<EOF" >> "$GITHUB_OUTPUT"
          echo "$NEW_FILES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: One-time Discord history backfill
        env:
          DISCORD_DEVLOG_WEBHOOK: ${{ secrets.DISCORD_DEVLOG_WEBHOOK }}
          DISCORD_CAPTAINSLOG_WEBHOOK: ${{ secrets.DISCORD_CAPTAINSLOG_WEBHOOK }}
        run: |
          python3 site/backfill_discord_history.py

      - name: One-time concept art backfill
        env:
          DISCORD_CONCEPTART_WEBHOOK: ${{ secrets.DISCORD_CONCEPTART_WEBHOOK }}
        run: |
          python3 site/backfill_concept_art.py

      - name: Generate today's Captain's Log entry
        id: captains_log
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 site/generate_captains_log.py --site-dir site

      - name: Commit and push if anything changed
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No queued entry today — nothing to publish."
            exit 0
          fi
          git config user.name "COGHEIM Devlog Bot"
          git config user.email "devlog-bot@users.noreply.github.com"
          git add site/
          git commit -m "Captain's Log — auto-publish $(date -u +%Y-%m-%d)"
          git push

      - name: Install Wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "303a415ac7d243036b1c87adf6c63ba2"
        run: wrangler deploy

      # --- Discord notifications: only after deploy, so links are live ---

      - name: Notify Discord of new Devlog posts
        if: steps.devlog_check.outputs.new_devlog_files != ''
        env:
          DISCORD_DEVLOG_WEBHOOK: ${{ secrets.DISCORD_DEVLOG_WEBHOOK }}
        run: |
          python3 site/notify_discord_devlog.py "${{ steps.devlog_check.outputs.new_devlog_files }}"

      - name: Notify Discord of new Captain's Log entry
        if: steps.captains_log.outputs.log_published == 'true'
        env:
          DISCORD_CAPTAINSLOG_WEBHOOK: ${{ secrets.DISCORD_CAPTAINSLOG_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_CAPTAINSLOG_WEBHOOK" ]; then
            echo "DISCORD_CAPTAINSLOG_WEBHOOK not set — skipping."
            exit 0
          fi
          TITLE="${{ steps.captains_log.outputs.log_title }}"
          URL="https://cogheim.com/${{ steps.captains_log.outputs.log_href }}"
          curl -s -A "COGHEIM-DevBot/1.0 (+https://cogheim.com)" -H "Content-Type: application/json" \
            -d "{\"embeds\":[{\"title\":\"$TITLE\",\"url\":\"$URL\",\"color\":15105570,\"footer\":{\"text\":\"New Captain's Log entry on cogheim.com\"}}]}" \
            "$DISCORD_CAPTAINSLOG_WEBHOOK"
